[options]
isa rv32imc
nbus 2
buslen 32

[depth]
insn                        35
insn_mul.*                  36
insn_sb                     64
insn_lb                     64
insn_lbu                    64
reg                   15    25
pc_fwd                10    30
pc_bwd                10    30
liveness              1  96 192
hang                  1     112
unique                1  20 32
causal                10    30
causal_mem            1     36
causal_io             1     36
cover                 1     45
csrw                        30
csr_ill                     30
interrupt                   34
csrc_any              1     5
csrc_const            1     5
bus_imem              1     30
bus_dmem              1     30
bus_dmem_io_read      1     30
bus_dmem_io_write     1     30
bus_dmem_io_order     1     30
fault                       24
bus_imem_fault        1     30
bus_dmem_fault        1     30
bus_dmem_io_read_fault 1   30
bus_dmem_io_write_fault 1  30

[sort]
reg_ch0

[filter-checks]
# With ICache enabled, an external instruction-bus fault happens on cache
# refill beats, which are not one-to-one with a retired instruction at the
# same PC. Keep architectural fault checking and data-side bus fault checking;
# proving I-cache refill fault attribution would need a cache-aware checker
# with refill/fill state visibility.
- bus_imem_fault_ch.*

[csrs]
# mstatus: only MIE (bit 3) and MPIE (bit 7) are writable
mstatus     any_mask="32'h 00000088"
# mie: only MSIE (3), MTIE (7), MEIE (11) are writable
mie         any_mask="32'h 00000888"
# mepc: bit 0 is hardwired to 0 (IALIGN=16 with RVC; bit 1 remains writable)
mepc        any_mask="32'h fffffffe"

# misa: hardwired to RV32IMC (bit30=MXL01, bit12=M, bit8=I, bit2=C)
misa        const="32'h 40001104"

# Fully RW CSRs: verified with the strict csrw check
mcause
mtval
mtvec
mscratch

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS
`define RISCV_FORMAL_COMPRESSED
`define RISCV_FORMAL_CSR_MSTATUS
`define RISCV_FORMAL_CSR_MTVEC
`define RISCV_FORMAL_CSR_MEPC
`define RISCV_FORMAL_CSR_MCAUSE
`define RISCV_FORMAL_CSR_MTVAL
`define RISCV_FORMAL_IOADDR(addr) (((addr) >= 32'h00000000 && (addr) <= 32'h00000fff) || ((addr) >= 32'h10000000 && (addr) <= 32'h10000fff))
`define CL1_FORMAL_ASSUME_ALIGNED_32I
`define CL1_USE_AXI_CACHE_DUT
# Fast AXI memory mode is intentionally disabled on the main cfg. Uncomment
# only for local triage runs that do not need bounded backpressure coverage.
# `define CL1_AXI_FAST_FORMAL_MEM

[defines fault]
`define RISCV_FORMAL_MEM_FAULT
`define CL1_AXI_FAULT_FORMAL_MEM
`define CL1_AXI_STRESS_BACKPRESSURE

[assume !fault_ch.*]
always @* if (cycle == `RISCV_FORMAL_CHECK_CYCLE) assume (rvfi_mem_fault[`RISCV_FORMAL_CHANNEL_IDX]);

[defines causal_mem]
`define CL1_AXI_STRESS_BACKPRESSURE

[defines causal_io]
`define CL1_AXI_STRESS_BACKPRESSURE

