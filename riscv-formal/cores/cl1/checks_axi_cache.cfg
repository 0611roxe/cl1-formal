`define CL1_AXI_STRESS_BACKPRESSURE

[defines hang]
`define RISCV_FORMAL_DEADLOCK_ENV
`define RISCV_FORMAL_MEM_FAULT
`define CL1_AXI_FAULT_FORMAL_MEM
`define CL1_AXI_STRESS_BACKPRESSURE
`define RISCV_FORMAL_INTERRUPT
`define RISCV_FORMAL_INTERRUPT_PROGRESS_ENV

[defines liveness]
`define RISCV_FORMAL_DEADLOCK_ENV
`define RISCV_FORMAL_MEM_FAULT
`define CL1_AXI_FAULT_FORMAL_MEM
`define CL1_AXI_STRESS_BACKPRESSURE
`define RISCV_FORMAL_INTERRUPT
`define RISCV_FORMAL_INTERRUPT_PROGRESS_ENV

[defines interrupt]
`define RISCV_FORMAL_INTERRUPT
`define CL1_AXI_STRESS_BACKPRESSURE

[defines cover]
`define RISCV_FORMAL_BUS
`define RISCV_FORMAL_NBUS 2
`define RISCV_FORMAL_BUSLEN 32
`define CL1_AXI_STRESS_BACKPRESSURE
`define CL1_AXI_COVER_ENV

[cover]
wire bus_read_valid  = rvfi_bus_valid[1] && rvfi_bus_data[1] && |rvfi_bus_rmask[1*4 +: 4];
wire bus_write_valid = rvfi_bus_valid[0] && rvfi_bus_data[0] && |rvfi_bus_wmask[0*4 +: 4];

reg seen_axi_read;
reg seen_axi_write;

always @(posedge clock) begin
	if (reset) begin
		seen_axi_read  <= 1'b0;
		seen_axi_write <= 1'b0;
	end else begin
		seen_axi_read  <= seen_axi_read || bus_read_valid;
		seen_axi_write <= seen_axi_write || bus_write_valid;
	end
end

always @* if (!reset) begin
	cover (channel[0].cnt_insns >= 2 && seen_axi_read);
	cover (channel[0].cnt_insns >= 2 && seen_axi_write);
	cover (channel[0].cnt_insns >= 2 && seen_axi_read && seen_axi_write);
end

